<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Dashboard</title>
<style>
  /* A plain placeholder until the table builds its own dashboard, in whatever look it
     chooses. It fills any window, so it reads well as a small tile on the big screen. */
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; padding: 0 7vw;
    background: #ffffff; color: #1f2124;
    font-family: system-ui, "Segoe UI", Arial, sans-serif;
  }
  .eyebrow { margin: 0 0 2vh; font-size: max(12px, 2.4vw); line-height: 1.2; font-weight: 700; letter-spacing: 0.08em; color: #5f6368; }
  h1 { margin: 0 0 3vh; font-size: max(26px, 6vw); line-height: 1.1; font-weight: 600; overflow-wrap: anywhere; }
  .note { margin: 0; font-size: max(17px, 3vw); line-height: 1.3; }
  .count { margin: 2vh 0 0; font-size: max(14px, 2.2vw); line-height: 1.3; color: #5f6368; }
</style>
</head>
<body>
  <div>
    <p class="eyebrow" id="table">WW LOANS INBOX</p>
    <h1 id="name">Our team</h1>
    <p class="note">This team hasn't built its dashboard yet.</p>
    <p class="count" id="count"></p>
  </div>
<script>
  // Fills in the table's number, name and progress from workshop.json.
  async function refresh() {
    try {
      const w = await (await fetch("/workshop.json", { cache: "no-store" })).json();
      if (w.team) {
        document.getElementById("table").textContent = `TABLE ${w.team}`;
        document.title = "Team Dashboard";
      }
      if (w.name) document.getElementById("name").textContent = w.name;
      const n = Array.isArray(w.emails) ? w.emails.length : 0;
      document.getElementById("count").textContent =
        n === 0 ? "No emails labelled yet." : `${n} email${n === 1 ? "" : "s"} labelled so far.`;
    } catch {
      // workshop.json is mid-save or broken: keep what's showing.
    }
  }
  refresh();
  setInterval(refresh, 10000);
</script>
</body>
</html>
